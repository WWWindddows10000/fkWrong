  <div width="200" style="text-align: center; font-size: 24px;height: 30px; color: #ffffff;background-color: #8f36f4;">

  </div>
  浮动窗口2内容
</div>
<script>
  // 获取两个可拖动窗口
  const scanWin = document.getElementById('scanWin');
  const prtWin = document.getElementById('prtWin');

  // 当前拖动状态
  let isDragging = false;
  let dragTarget = null;
  let offsetX = 0;
  let offsetY = 0;

  // 公共mousedown绑定
  function setupDragEvents(elem) {
    elem.addEventListener('mousedown', function(e) {
      // 只允许拖动顶部标题区域
      if (e.target.tagName.toLowerCase() === 'button') return; // 忽略点击关闭按钮
      isDragging = true;
      dragTarget = elem;
      offsetX = e.clientX - elem.offsetLeft;
      offsetY = e.clientY - elem.offsetTop;
      elem.style.cursor = 'grabbing';
    });
  }

  // 应用到两个元素
  setupDragEvents(scanWin);
  setupDragEvents(prtWin);

  // 鼠标移动时拖动窗口
  document.addEventListener('mousemove', function(e) {
    if (isDragging && dragTarget) {
      dragTarget.style.left = (e.clientX - offsetX) + 'px';
      dragTarget.style.top = (e.clientY - offsetY) + 'px';
    }
  });

  // 鼠标释放时取消拖动
  document.addEventListener('mouseup', function() {
    if (isDragging && dragTarget) {
      dragTarget.style.cursor = 'move';
    }
    isDragging = false;
    dragTarget = null;
  });
</script>
