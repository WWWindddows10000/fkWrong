<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: -1;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        
        label i {
            margin-right: 10px;
            font-size: 1.1rem;
        }
        
        input, select {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(110, 142, 251, 0.5);
            background: rgba(255, 255, 255, 1);
        }
        
        .input-icon {
            position: relative;
        }
        
        .input-icon i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #a777e3;
            font-size: 1.2rem;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #6e8efb, #a777e3);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(110, 142, 251, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.5);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .hint {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 30px;
            color: white;
            font-size: 0.9rem;
            border-left: 4px solid #a777e3;
        }
        
        .hint-title {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .hint-title i {
            margin-right: 10px;
            color: #ffcc00;
        }
        
        .feature-cards {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        
        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            width: 30%;
            transition: all 0.3s ease;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }
        
        .feature-card i {
            font-size: 2rem;
            color: white;
            margin-bottom: 15px;
        }
        
        .feature-card h3 {
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 30px;
            font-size: 0.85rem;
        }
        
        .required::after {
            content: " *";
            color: #ff4757;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .feature-cards {
                flex-direction: column;
                gap: 15px;
            }
            
            .feature-card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-circle-exclamation"></i> 404 </h1><br>
            <p style="color:rgb(255, 255, 255)">“对不起，你没错，我错了。”</p><br>
        <h3>我想，懒惰的Windows还没有填充这个内容，也有可能是他在代码里把超链接打错了……</h3>
        <div class="hint">
            <div class="hint-title">
                <i class="fas fa-lightbulb"></i> 瘟腥提示
            </div>
            <p>请<span style="color: #be0000; font-weight: 600">不要</span>威胁他去更改或者给他发邮件，毕竟他是个懒人。<br>正确的做法是在GitHub上提交issue，然后静心等待，说不定哪天就好了。<br>开源代码没有任何盈利空间，各退一步，望您理解。</p>
        </div>
        <div class="header">
        <button class="back-btn" id="backButton">
            <i class="fas fa-arrow-left"></i> 返回上一页
        </button>
    </div>
        <script>
            document.getElementById('backButton').addEventListener('click', function() {
                window.history.back();
            });
        </script>
    </div>
        
</body>
</html>
