<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>扫描文件</title>
  <style>
    li.error {
      background-color: #5a5a5a;
      border-color: #1fe291;
      color: #e9f0f6;
      font-weight: bold;
      font-size: 14px;
    }
    ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      text-align: center;
    }
    li {
      cursor: pointer;
      display: block;
      margin: auto;
      width: 80%;
      padding: 8px 16px;
      border: 1px double #2600ff;
      transition: background-color 0.4s;
    }
    #select_upload {
      table-layout: fixed;
      border: none;
    }
    #upload{
      width: auto;
      height: 100px;
      border: 2px dashed #868686;
      border-radius: 10px;
      text-align: center;
      line-height: 100px;
      color: #000000;
      background-color: aquamarine;
      font-size: 16px;
      margin: auto;
    }
    li:hover {
      background-color: #31968d;
    }
    .two_column {
      border: none;
    }
    li.error:hover {
      background-color: #4b4b4b;
    }
    body {
      font-family: "宋体";
      color:#e9f0f6;
      
    }
    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .marquee-wrap {
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
      position: relative;
    }

  </style><!-- 如果使用外部css的话，不起作用，我也不知道为啥，neither ai knows~ -->
</head>

<body>
<div class="container">

        <table id="select_upload" width="700" height="200" border="3" align="center">
          <tr>
            <th class="two_column" scope="col">
              <div>
                你可以……
                <p></p>
                  <button style="width: 100%" onClick="scan()">扫描文件</button>
                <p></p>
                或者
                <p></p>
                <div id="upload">拖动文件到这里上传</div>
              </div></th>
            <th class="two_column" scope="col">
              <div align="center">
        也可以从以下最近7条邮件中选择……
        <p></p>
          <ul>
            {% for emailContent in emails %}
              {% if emailContent|length >= 30 %}
                <li onClick="handleEmail('{{ loop.index0 }}')"><div class="marquee-wrap"><marquee scrollamount="13">{{ emailContent }}</marquee></div></li>
              {% else %}
                <li onClick="handleEmail('{{ loop.index0 }}')">{{ emailContent }}</li>
              {% endif %}
            {% endfor %}
            {% if not emails %}
              <li class="error">我们这边出了点问题……（没有找到邮件）</li>
            {% endif %}
          </ul>
      </td>

      </div>
              </th>
          </tr>
        </table>

</div>
<script src="../static/js/upload.js"></script>
</body>
